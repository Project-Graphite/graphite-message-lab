name: graphite-message-lab

x-app-environment: &app-environment
  SECRET_KEY: ${SECRET_KEY:?}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-message-lab.project-graphite.com,localhost}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://message-lab.project-graphite.com}
  POSTGRES_DB: graphite_message_lab
  POSTGRES_HOST: postgres
  POSTGRES_USER: graphite_message_lab
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  REDIS_URL: redis://redis:6379/0
  WEB_CONCURRENCY: "1"

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: graphite_message_lab
      POSTGRES_USER: graphite_message_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U graphite_message_lab -d graphite_message_lab]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  redis:
    image: redis:8.10.2-trixie
    command: [redis-server, --appendonly, "yes", --maxmemory, 96mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 10s
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  web:
    image: ghcr.io/project-graphite/graphite-message-lab/web:${IMAGE_TAG:-main}
    command: [sh, -c, "python manage.py migrate --noinput && exec gunicorn -c python:config.gunicorn config.wsgi"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8000/up/databases]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  worker:
    image: ghcr.io/project-graphite/graphite-message-lab/worker:${IMAGE_TAG:-main}
    command: [celery, -A, config, worker, --loglevel=info, --concurrency=1, --max-tasks-per-child=100]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "celery -A config inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 60s
      timeout: 30s
      start_period: 30s
      retries: 3
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

volumes:
  postgres-data: {}
  redis-data: {}
