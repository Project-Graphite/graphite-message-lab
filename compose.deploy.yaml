services:
  postgres:
    image: postgres:18.6-trixie
    env_file: ${APP_ENV_FILE:-deploy.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.10.1-trixie
    command: redis-server --appendonly yes
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis-data:/data

  web:
    image: ghcr.io/project-graphite/graphite-message-lab/web:${IMAGE_TAG:?set IMAGE_TAG in deploy.env}
    env_file: ${APP_ENV_FILE:-deploy.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl --fail http://localhost:8000/up/databases || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - 127.0.0.1:8000:8000
    restart: unless-stopped

  worker:
    image: ghcr.io/project-graphite/graphite-message-lab/worker:${IMAGE_TAG:?set IMAGE_TAG in deploy.env}
    entrypoint: []
    command: celery -A config worker --loglevel=info
    env_file: ${APP_ENV_FILE:-deploy.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: ghcr.io/project-graphite/graphite-message-lab/web:${IMAGE_TAG:?set IMAGE_TAG in deploy.env}
    entrypoint: []
    command: python manage.py migrate --noinput
    env_file: ${APP_ENV_FILE:-deploy.env}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]

volumes:
  postgres-data:
  redis-data:
